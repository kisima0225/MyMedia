spring:
  application:
    name: mymedia
  threads:
    virtual:
      enabled: true          # 本项目是重阻塞 I/O 场景，见 spec §3.3
  datasource:
    url: jdbc:postgresql://localhost:5432/mymedia
    username: mymedia
    password: mymedia
  jpa:
    hibernate:
      ddl-auto: validate     # schema 由 Flyway 管理，绝不让 Hibernate 改表
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith

logging:
  level:
    com.mymedia: DEBUG

mymedia:
  admin:
    username: admin
    password: admin      # 仅用于本地演示，生产部署必须通过环境变量覆盖
  jobs:
    enabled: true            # 生产默认启用；集成测试基类显式关闭
    poll-interval: PT5S      # 轮询间隔
    batch-size: 5            # 单次抢占的任务数
    lease-duration: PT10M    # 租约时长，超时视为 worker 已死
  scan:
    max-depth: 32            # 遍历最大深度，防御异常深的目录结构
  image:
    # 压缩包条目名的「回退」编码，不是强制编码。
    # ZIP 通用位标记第 11 位为 1 的条目一律按 UTF-8 解，本设置根本不参与；
    # 只有没打这个标记的归档（Windows 中文压缩工具的典型产物）才用它。
    # 因此设成 GBK 不会破坏 UTF-8 归档 —— 这一点已实测验证。
    archive-charset: GBK
  preview:
    wiring-enabled: true       # 事件接线默认启用；测试可显式关闭非预览场景
    root: ./data/derived        # 派生资源根目录，独立于媒体库路径，可整个删掉重建
    ffmpeg-path: ffmpeg         # 镜像里烘焙好，本机不装也能跑测试
    ffprobe-path: ffprobe
    command-timeout: PT2M       # 单次外部进程调用的上限
    cover-width: 640
    thumbnail-width: 320
    sprite-frames: 100          # 固定 100 帧，永远单张图
    sprite-columns: 10          # 10 × 10
    sprite-tile-width: 160
    sprite-min-duration-seconds: 10   # 太短的视频不值得做雪碧图
  metadata:
    user-agent: "MyMedia/0.1 (https://github.com/kisima0225/MyMedia)"   # 匿名爬对方是给自己招风控
    min-request-interval: PT1S      # 客户端侧限流
    auto-apply-threshold: 0.8       # 相似度达到就自动应用
    review-threshold: 0.4           # 达到就进待确认队列，低于此直接丢弃
    bangumi:
      base-url: https://api.bgm.tv  # 无需鉴权（已实测）
    tmdb:
      base-url: https://api.themoviedb.org/3
      api-key: ""                   # 留空 → TmdbProvider 报告不可用，链跳过它，不算错误
      language: zh-CN
  share:
    # 留空则每次启动随机生成，重启后带密码的分享链接需要访客重新输一次密码。
    # 生产部署应当配一个固定值（任意长随机串）。
    secret: ""
    ticket-ttl: PT12H
  upload:
    # 未合并的分片落在这里，独立于媒体库根目录——半成品绝不能出现在会被扫描的目录里
    temp-root: ./data/uploads
    chunk-size: 8388608      # 8MB
    max-size: 21474836480    # 20GB
